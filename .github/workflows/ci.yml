name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          PODMAN: sudo podman
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      - name: Check osqueryd logs scheduled results and file changes
        working-directory: examples/local
        run: sudo podman exec -i circuit-osquery sh < check.sh
      # Restarting the container boots systemd again, so this checks osqueryd
      # comes back by itself, still logs, and the plan has nothing to do.
      - name: Restart the host, then check osqueryd and the plan
        working-directory: examples/local
        run: |
          sudo podman restart circuit-osquery
          for _ in $(seq 60); do
            case $(sudo podman exec circuit-osquery systemctl is-system-running 2>/dev/null) in running|degraded) break ;; esac
            sleep 1
          done
          sudo podman exec -i circuit-osquery sh < check.sh
          conn3x plan -detailed-exitcode
      # No Fleet server answers, so osqueryd can't enroll, but the secret
      # still has to reach its file on the host and stay out of state.
      # Applying without fleet then has to delete it and bring the local
      # config back.
      - name: Apply with a Fleet enroll secret, then check it stayed out of state
        working-directory: examples/local
        run: |
          secret=conn3x-ci-$(openssl rand -hex 12)
          TF_VAR_enroll_secret=$secret conn3x apply -auto-approve -var 'fleet={address="127.0.0.1:8080"}'
          [ "$(sudo podman exec circuit-osquery cat /etc/osquery/enroll_secret)" = "$secret" ]
          [ "$(sudo podman exec circuit-osquery stat -c %a /etc/osquery/enroll_secret)" = 600 ]
          sudo podman exec circuit-osquery grep -qx -- --enroll_secret_path=/etc/osquery/enroll_secret /etc/osquery/osquery.flags
          if grep -q "$secret" terraform.tfstate; then
            echo "The enroll secret is in terraform.tfstate." >&2
            exit 1
          fi
          conn3x apply -auto-approve
          sudo podman exec circuit-osquery test ! -e /etc/osquery/enroll_secret
          conn3x plan -detailed-exitcode
          sudo podman exec -i circuit-osquery sh < check.sh
      # A fresh host gets the previous release, then the circuit's own pin is
      # applied over it, the way someone raises osquery_version.
      - name: Upgrade from osquery 5.23.1 on a fresh host, then plan again with no changes
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          PODMAN: sudo podman
        run: |
          ./down.sh
          ./up.sh
          conn3x init
          conn3x apply -auto-approve -var osquery_version=5.23.1
          sudo podman exec circuit-osquery osqueryi --json "SELECT version FROM osquery_info" | grep -q '"version":"5.23.1"'
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
          sudo podman exec circuit-osquery osqueryi --json "SELECT version FROM osquery_info" | grep -q '"version":"5.24.0"'
      - name: Check the upgraded osqueryd logs scheduled results and file changes
        working-directory: examples/local
        run: sudo podman exec -i circuit-osquery sh < check.sh
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh
